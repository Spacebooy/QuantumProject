services:
  postgres:
    image: postgres:16-alpine
    container_name: quantum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantum_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quantum_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quantum-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quantum_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quantum_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quantum-network

  frontend:
    build:
      context: ./quantum-frontend
      dockerfile: Dockerfile.frontend
    container_name: quantum_frontend
    restart: unless-stopped
    environment:
      - API_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - quantum-network

volumes:
  postgres_data:
    driver: local

networks:
  quantum-network:
    driver: bridge
